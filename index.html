<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Udkigstjeneste & flykending</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
    }

    video {
      position: fixed;
      inset: 24px;
      width: calc(100vw - 48px);
      height: calc(100vh - 48px);
      object-fit: contain;
      background: #000;
    }

    #status {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      padding: 14px 24px;
      background: rgba(16, 24, 39, .75);
      border-radius: 12px;
      font-size: 1.3rem;
      text-align: center;
    }

    #answer {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: min(90vw, 760px);
      padding: 24px 36px;
      background: rgba(16, 24, 39, .88);
      border: 2px solid #fbbf24;
      border-radius: 16px;
      text-align: center;
      font-size: 1.1rem;
      overflow-wrap: anywhere;
    }

    #phrase {
      margin: 10px 0 6px;
      font-size: 2.4rem;
      font-weight: 700;
    }

    #answer .hint {
      margin: 0;
      color: #b8c4d8;
      font-size: .95rem;
    }

    #score {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 14px 0;
      font-size: 1.2rem;
      font-weight: 650;
    }

    #score button {
      width: 40px;
      height: 40px;
      background: #1f2937;
      border: 1px solid #b8c4d8;
      border-radius: 8px;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    #score button:hover { background: #374151; }

    #score-value {
      min-width: 2ch;
      font-size: 1.6rem;
    }

    /* Relative bearing indicator: 25° port (red) to 25° starboard (green) */
    #bearing {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 78px;
      padding: 0 40px;
      background: rgba(0, 0, 0, .55);
      pointer-events: none;
    }

    #scale {
      position: relative;
      height: 100%;
    }

    #scale::before,
    #scale::after {
      content: "";
      position: absolute;
      top: 0;
      height: 6px;
      width: 50%;
    }

    #scale::before { left: 0; background: #ef4444; }
    #scale::after { right: 0; background: #22c55e; }

    .tick {
      position: absolute;
      top: 0;
      width: 2px;
      height: 14px;
      transform: translateX(-50%);
      background: #f8fafc;
    }

    .tick.major { height: 26px; width: 3px; }

    .label {
      position: absolute;
      top: 30px;
      transform: translateX(-50%);
      font-size: 15px;
      font-weight: 650;
    }

    .port { color: #f87171; }
    .stbd { color: #4ade80; }

    .side {
      position: absolute;
      bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .side.port { left: 0; }
    .side.stbd { right: 0; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <video id="video" playsinline></video>

  <p id="status" role="status" aria-live="polite">
    Tryk mellemrum for at starte
  </p>

  <section id="answer" aria-live="polite" hidden>
    <p id="phrase"></p>
    <div id="score">
      <span>Korrekt svar</span>
      <button id="score-minus" type="button" aria-label="Træk et korrekt svar fra">−</button>
      <span id="score-value" aria-live="polite">0</span>
      <button id="score-plus" type="button" aria-label="Læg et korrekt svar til">+</button>
    </div>
    <p id="hint" class="hint"></p>
  </section>

  <div id="bearing" aria-hidden="true">
    <div id="scale">
      <span class="side port">PORT</span>
      <span class="side stbd">STBD</span>
    </div>
  </div>

  <script>
    // Edit this list to match your video files and phrases.
    const clips = [
      { video: "videos/1.mp4", answer: "1" },
      { video: "videos/2.mp4", answer: "2" },
      { video: "videos/3.mp4", answer: "3" },
      { video: "videos/4.mp4", answer: "4" },
      { video: "videos/5.mp4", answer: "5" },
      { video: "videos/6.mp4", answer: "6" },
      { video: "videos/7.mp4", answer: "7" },
      { video: "videos/8.mp4", answer: "8" },
      { video: "videos/9.mp4", answer: "9" },
      { video: "videos/10.mp4", answer: "10" },
      { video: "videos/11.mp4", answer: "11" },
      { video: "videos/12.mp4", answer: "12" },
      { video: "videos/13.mp4", answer: "13" },
      { video: "videos/14.mp4", answer: "14" },
      { video: "videos/15.mp4", answer: "15" },
      { video: "videos/16.mp4", answer: "16" },
      { video: "videos/17.mp4", answer: "17" },
      { video: "videos/18.mp4", answer: "18" },
      { video: "videos/19.mp4", answer: "19" },
      { video: "videos/20.mp4", answer: "20" },
      { video: "videos/21.mp4", answer: "21" },
      { video: "videos/22.mp4", answer: "22" }
    ];

    // Seconds after the clip ends before the answer is shown.
    const REVEAL_DELAY_MS = 2000;
    const MAX_BEARING = 25;

    const video = document.querySelector("#video");
    const status = document.querySelector("#status");
    const answer = document.querySelector("#answer");
    const phrase = document.querySelector("#phrase");
    const scale = document.querySelector("#scale");
    const hint = document.querySelector("#hint");
    const scoreValue = document.querySelector("#score-value");

    let currentClip = null;
    let nextClipIndex = 0;
    let score = 0;
    let playing = false;
    let revealTimer = null;

    // Build the bearing scale: a tick every degree, labelled every 5°.
    for (let b = -MAX_BEARING; b <= MAX_BEARING; b++) {
      const pos = ((b + MAX_BEARING) / (2 * MAX_BEARING)) * 100 + "%";
      const major = b % 5 === 0;

      const tick = document.createElement("div");
      tick.className = "tick" + (major ? " major" : "");
      tick.style.left = pos;
      scale.appendChild(tick);

      if (major) {
        const label = document.createElement("span");
        label.className = "label " + (b < 0 ? "port" : b > 0 ? "stbd" : "");
        label.style.left = pos;
        label.textContent = Math.abs(b) + "°";
        scale.appendChild(label);
      }
    }

    // Fisher-Yates shuffle, so every order of the clips is equally likely.
    function shuffleClips() {
      for (let i = clips.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [clips[i], clips[j]] = [clips[j], clips[i]];
      }
    }

    function changeScore(change) {
      score = Math.min(Math.max(score + change, 0), clips.length);
      scoreValue.textContent = score;
    }

    function showResult() {
      answer.hidden = true;
      status.textContent =
        `Korrekt svar: ${score} / ${clips.length}. Tryk mellemrum for at starte forfra`;
      status.hidden = false;
      currentClip = null;
      nextClipIndex = 0;
      changeScore(-score);
      shuffleClips();
    }

    async function playClip() {
      if (playing || clips.length === 0) return;

      if (nextClipIndex === clips.length) {
        showResult();
        return;
      }

      playing = true;
      clearTimeout(revealTimer);
      currentClip = clips[nextClipIndex];

      answer.hidden = true;
      phrase.textContent = "";
      status.hidden = true;
      video.src = currentClip.video;
      video.load();

      try {
        await video.play();
      } catch (error) {
        // Skipping to another case interrupts the previous play() call.
        if (error.name === "AbortError") return;

        playing = false;
        status.textContent =
          "Couldn't play this clip. Check the file path and press Space to try again.";
        status.hidden = false;
      }
    }

    function revealAnswer() {
      nextClipIndex++;
      phrase.textContent = currentClip.answer;
      hint.textContent = nextClipIndex === clips.length
        ? "Sidste case. Tryk mellemrum for at se resultatet"
        : "Tryk mellemrum for næste case · ← → for at skifte case";
      answer.hidden = false;
      playing = false;
    }

    function skipClip(step) {
      // indexOf gives -1 before the first clip, so the right arrow starts at clip one.
      const target = clips.indexOf(currentClip) + step;
      if (target < 0 || target >= clips.length) return;

      clearTimeout(revealTimer);
      video.pause();
      playing = false;
      nextClipIndex = target;
      playClip();
    }

    video.addEventListener("ended", () => {
      revealTimer = setTimeout(revealAnswer, REVEAL_DELAY_MS);
    });

    // Drop focus after a click so the Space key can't press the button again.
    document.querySelector("#score-minus").addEventListener("click", event => {
      changeScore(-1);
      event.currentTarget.blur();
    });

    document.querySelector("#score-plus").addEventListener("click", event => {
      changeScore(1);
      event.currentTarget.blur();
    });

    document.addEventListener("keydown", event => {
      const isSkip = event.code === "ArrowLeft" || event.code === "ArrowRight";
      if ((event.code !== "Space" && !isSkip) || event.repeat) return;
      event.preventDefault();

      // Go fullscreen on the first key press (browsers require a user action).
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      if (isSkip) {
        skipClip(event.code === "ArrowRight" ? 1 : -1);
      } else {
        playClip();
      }
    });

    shuffleClips();

    if (clips.length === 0) {
      status.textContent = "Add at least one clip to the clips list.";
    }
  </script>
</body>
</html>
